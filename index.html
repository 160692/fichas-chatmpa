<style>
/* Layout: herramienta de captura. Barra superior fija, navegación de secciones a la izquierda,
   formulario en una columna, barra de acciones fija abajo. Paleta del deck ChatMPA × CONANP. */
:root{
  --bg:#f3eee4; --surface:#faf7f0; --field:#ffffff; --ink:#142a40; --head:#0f2a45; --muted:#5d6d7a;
  --line:#d9d2c4; --accent:#1c7fb0; --accent-soft:#dcf1fa; --primary:#0f2a45; --on-primary:#ffffff;
  --ok:#1f7a5c; --ok-soft:#e1f3ec; --warn:#85560f; --warn-soft:#fbefd6; --bad:#a03a3a; --bad-soft:#f8e3e3;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1826; --surface:#102236; --field:#0d1d2e; --ink:#e6edf3; --head:#f1f6fa; --muted:#9db0bf;
    --line:#25405a; --accent:#5ec0ee; --accent-soft:#12364b; --primary:#59b8e7; --on-primary:#06202f;
    --ok:#5fcf9f; --ok-soft:#0f3328; --warn:#e8b45c; --warn-soft:#3a2b0e; --bad:#ee8f8f; --bad-soft:#401d1d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1826; --surface:#102236; --field:#0d1d2e; --ink:#e6edf3; --head:#f1f6fa; --muted:#9db0bf;
  --line:#25405a; --accent:#5ec0ee; --accent-soft:#12364b; --primary:#59b8e7; --on-primary:#06202f;
  --ok:#5fcf9f; --ok-soft:#0f3328; --warn:#e8b45c; --warn-soft:#3a2b0e; --bad:#ee8f8f; --bad-soft:#401d1d;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;padding-bottom:120px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol{margin:0}
h2{font-size:21px;line-height:1.2;letter-spacing:-.015em;color:var(--head);text-wrap:balance}
h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--head);letter-spacing:-.02em}
.mark{width:28px;height:28px;border-radius:50%;background:var(--head);position:relative;flex:none}
.mark:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--accent);right:1px;top:1px}
.pick{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 320px}
.pick label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);flex:none}
select,input[type=text],input[type=email],input[type=tel],input[type=date],textarea{
  width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
select{cursor:pointer}
textarea{resize:vertical;min-height:84px;line-height:1.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;padding-bottom:10px;overflow-x:auto}
.tab{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.banner{margin-top:14px;padding:11px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:36px;padding-block:24px}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 118px);align-self:start;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;justify-content:space-between;gap:10px;text-align:left;background:transparent;border:0;border-radius:8px;padding:8px 10px;color:var(--muted);cursor:pointer;font-weight:500}
.nav button:hover{background:var(--accent-soft);color:var(--head)}
.nav .n{font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
.nav .done{color:var(--ok);font-weight:700}
.sec{padding-block:6px 30px;scroll-margin-top:150px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:6px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.intro{color:var(--muted);margin-bottom:12px;max-width:68ch}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px;margin-top:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>label,.fld>.lbl{font-weight:650;color:var(--head)}
.hint{font-size:13px;color:var(--muted);max-width:70ch}
.req{color:var(--bad);font-weight:700}
.cnt{font-size:12px;color:var(--warn);font-variant-numeric:tabular-nums;align-self:flex-end}
.err{font-size:13px;color:var(--bad);font-weight:600}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label{display:flex;align-items:center;gap:7px;font-weight:500}
.ctx{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:26px}
.ctx summary{cursor:pointer;font-weight:700;color:var(--head);font-size:17px}
.ctx summary span{font-weight:500;color:var(--muted);font-size:14px}
.when{margin-top:8px;color:var(--muted)}
.ctx-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;margin-top:14px}
.ctx ul,.ctx ol{padding-left:18px;display:flex;flex-direction:column;gap:4px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--field);border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:13px;font-weight:550}
.ctx .blk+.blk{margin-top:14px}
.note{background:var(--accent-soft);color:var(--head);border-radius:10px;padding:12px 14px;margin-bottom:24px;max-width:78ch}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.stat{flex:1 1 280px;min-width:0;font-size:13.5px;color:var(--muted)}
.stat.ok{color:var(--ok)} .stat.warn{color:var(--warn)} .stat.bad{color:var(--bad)}
.stat a{color:inherit;font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--field);border-radius:9px;padding:9px 15px;font-weight:650;cursor:pointer;color:var(--head)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn[disabled]{opacity:.6;cursor:progress}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.codebox{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.codebox label{font-weight:650;color:var(--head)}
.codebox input{max-width:240px;flex:1 1 160px}
.fallback{margin-top:10px;display:none}
.fallback.show{display:block}
.fallback textarea{min-height:140px;font-size:13px}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);gap:8px}
  .nav{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  .nav button{border:1px solid var(--line);white-space:nowrap}
  .grid,.ctx-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  .top{position:static}
  .top-row{gap:8px 12px;padding-block:10px}
  .bar-in{gap:6px 10px}
  .stat{flex-basis:100%;font-size:12.5px}
  .btns{width:100%;flex-wrap:nowrap}
  .btn{flex:1 1 0;padding:9px 6px;font-size:13px;text-align:center}
  body{padding-bottom:130px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand"><span class="mark" aria-hidden="true"></span>ChatMPA × CONANP</div>
      <div class="pick"><label for="mesaSel">Mesa</label><select id="mesaSel"></select></div>
      <button class="btn quiet" id="resetBtn" type="button">Nueva ficha</button>
    </div>
    <div class="tabs" role="tablist" aria-label="Tipo de ficha">
      <button class="tab" role="tab" id="tab-mesa" data-tab="mesa" type="button">Ficha de la mesa</button>
      <button class="tab" role="tab" id="tab-insumos" data-tab="insumos" type="button">Insumos por área (CBMC)</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="banner" id="banner" hidden></div>
  <div class="codebox" id="codeBox" hidden><label for="codeIn">Código de acceso</label><input id="codeIn" type="password" autocomplete="off" placeholder="Te lo da el equipo de Bool"><button class="btn" id="codeBtn" type="button">Usar código</button></div>
  <div class="layout">
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <main id="main"></main>
  </div>
</div>

<div class="bar">
  <div class="wrap bar-in">
    <div class="stat" id="stat" role="status" aria-live="polite"></div>
    <div class="btns">
      <button class="btn" id="copyBtn" type="button">Copiar respuestas</button>
      <button class="btn" id="dlBtn" type="button">Descargar respaldo</button>
      <button class="btn primary" id="saveBtn" type="button">Guardar en Notion</button>
    </div>
  </div>
  <div class="wrap fallback" id="fallback">
    <label class="hint" for="fbText">Selecciona todo el texto y cópialo (Ctrl/Cmd + C).</label>
    <textarea id="fbText" readonly></textarea>
  </div>
</div>

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function mesa(){for(var i=0;i<MESAS.length;i++){if(MESAS[i].k===mesaKey)return MESAS[i];}return MESAS[0];}
function key(){return "fichasChatMPA:v1:"+tab+":"+mesaKey;}
function newId(){
  try{if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();}catch(e){}
  var s=""; for(var i=0;i<32;i++)s+=Math.floor(Math.random()*16).toString(16);
  return s.slice(0,8)+"-"+s.slice(8,12)+"-"+s.slice(12,16)+"-"+s.slice(16,20)+"-"+s.slice(20);
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtTime(ts){try{return new Date(ts).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});}catch(e){return "";}}
function shortDate(iso){
  var m=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"], p=String(iso||"").split("-");
  if(p.length!==3)return ""; return parseInt(p[2],10)+" "+m[parseInt(p[1],10)-1];
}

function loadDraft(){
  values={}; rec={}; titleAuto=true; sid="";

  if(raw){try{var o=JSON.parse(raw); values=o.v||{}; rec=o.rec||{}; sid=o.sid||""; titleAuto=(o.ta!==false);}catch(e){}}
  if(!sid){sid=newId(); lsSet(key(),JSON.stringify({v:values,rec:rec,sid:sid,ta:titleAuto,t:Date.now()}));}
  if(tab==="mesa"){
    if(!values["Fecha de la sesión"])values["Fecha de la sesión"]=mesa().date;
    if(titleAuto||!values["Ficha (Mesa y fecha)"])autoTitle();
  }
}
function persist(){

}

function procLabel(opt){

  if(opt==="Proceso 1 propuesto")return "Proceso 1 · "+m.proposed[0];

}
function fieldHTML(f){
  var id="f"+f.i, req=f.req?' <span class="req" aria-hidden="true">*</span>':"", ctl="";
  var hint=f.h?'<span class="hint" id="h'+f.i+'">'+esc(f.h)+'</span>':"";
  var desc=f.h?' aria-describedby="h'+f.i+'"':"";
  if(f.t==="area"){
    ctl='<textarea id="'+id+'" data-i="'+f.i+'" rows="'+(f.r||3)+'" maxlength="'+MAXLEN+'"'+desc+'></textarea><span class="cnt" id="c'+f.i+'" hidden></span>';
  }else if(f.t==="select"){
    ctl='<select id="'+id+'" data-i="'+f.i+'"'+desc+'><option value="">Selecciona…</option>'+f.o.map(function(o){
      return '<option value="'+esc(o)+'">'+esc(f.proc?procLabel(o):o)+'</option>';}).join("")+'</select>';
  }else if(f.t==="multi"){
    ctl='<div class="checks" role="group" aria-labelledby="l'+f.i+'">'+f.o.map(function(o,j){
      return '<label><input type="checkbox" data-i="'+f.i+'" data-o="'+esc(o)+'" id="'+id+'_'+j+'"> '+esc(o)+'</label>';}).join("")+'</div>';
  }else{
    var type=f.t==="date"?"date":(f.t==="email"?"email":(f.t==="tel"?"tel":"text"));
    ctl='<input id="'+id+'" data-i="'+f.i+'" type="'+type+'"'+(f.t==="text"?' maxlength="300"':"")+desc+'>';
  }
  var lab=f.t==="multi"?'<span class="lbl" id="l'+f.i+'">'+esc(f.l)+req+'</span>':'<label for="'+id+'">'+esc(f.l)+req+'</label>';
  return '<div class="fld'+(f.full?" full":"")+'">'+lab+hint+ctl+'<span class="err" id="e'+f.i+'" hidden></span></div>';
}
function contextHTML(){
  var m=mesa();
  function li(a){return a.map(function(x){return "<li>"+esc(x)+"</li>";}).join("");}
  function ch(a){return a.map(function(x){return '<span class="chip">'+esc(x)+"</span>";}).join("");}
  return '<details class="ctx" open><summary>Lo que entendimos de esta mesa <span>· por validar</span></summary>'+
    '<p class="when">'+esc(m.name)+" · "+esc(m.when)+'</p>'+
    '<div class="ctx-grid"><div><div class="blk"><h3>Procesos o actividades reportadas</h3><ul>'+li(m.findings)+'</ul></div>'+
    '<div class="blk"><h3>Productos o decisiones</h3><div class="chips">'+ch(m.products)+'</div></div></div>'+
    '<div><div class="blk"><h3>Datos y fuentes que utilizan</h3><div class="chips">'+ch(m.sources)+'</div></div>'+
    '<div class="blk"><h3>Fricciones reportadas</h3><ul>'+li(m.frictions)+'</ul></div></div></div>'+
    '<div class="blk" style="margin-top:14px"><h3>Dos procesos propuestos para trabajar hoy</h3><ol>'+li(m.proposed)+'</ol></div></details>';
}
function render(){
  var T=TABS[tab], h="";
  $("#tab-mesa").setAttribute("aria-selected",tab==="mesa"?"true":"false");
  $("#tab-insumos").setAttribute("aria-selected",tab==="insumos"?"true":"false");
  if(tab==="mesa"){h+=contextHTML();}
  else{h+='<p class="note">Esta ficha prepara la evidencia trazable de cada mesa del co-diseño. No aprueba ni compromete desarrollos. Describe procesos, activos de información, responsables, restricciones y casos candidatos, distinguiendo fuente oficial, base de datos y sistema o repositorio. Se llena una vez por área o persona.</p>';}
  T.secs.forEach(function(s,si){
    h+='<section class="sec" id="sec'+si+'"><div class="sec-h"><div><p class="eyebrow">'+esc(s.ref)+'</p><h2>'+esc(s.title)+'</h2></div><span class="count" id="cnt'+si+'"></span></div>'+
       (s.intro?'<p class="intro">'+esc(s.intro)+'</p>':"")+'<div class="grid">'+s.fields.map(fieldHTML).join("")+'</div></section>';
  });
  $("#main").innerHTML=h;
  $("#nav").innerHTML=T.secs.map(function(s,si){
    return '<button type="button" data-sec="'+si+'"><span>'+esc(s.title)+'</span><span class="n" id="nn'+si+'"></span></button>';}).join("");
  T.flat.forEach(function(f){ setControl(f); });
  updateCounts(); updateSaveLabel(); setDraftNote(true);
}
function setControl(f){
  var v=values[f.p], id="f"+f.i;
  if(f.t==="multi"){
    var arr=Array.isArray(v)?v:[];
    f.o.forEach(function(o,j){var c=$("#"+id+"_"+j); if(c)c.checked=arr.indexOf(o)>=0;});
  }else{
    var el=$("#"+id); if(el)el.value=(v==null?"":v);
    if(f.t==="area")updateCnt(f);
  }
}
function updateCnt(f){
  var el=$("#f"+f.i), c=$("#c"+f.i); if(!el||!c)return;
  var n=el.value.length;
  if(n>=MAXLEN-300){c.hidden=false; c.textContent=n+" / "+MAXLEN+(n>=MAXLEN?" · límite por pregunta; continúa en la siguiente":"");}
  else c.hidden=true;
}
function filled(f){
  var v=values[f.p];
  return Array.isArray(v)?v.length>0:(v!=null&&String(v).trim()!=="");
}
function isMeta(f){return f.p===TABS[tab].titleProp||f.p==="Fecha de la sesión";}
function updateCounts(){
  TABS[tab].secs.forEach(function(s,si){
    var qs=s.fields.filter(function(f){return !isMeta(f);}), done=qs.filter(filled).length;
    var c=$("#cnt"+si), n=$("#nn"+si);
    if(qs.length){
      if(c)c.textContent=done+" de "+qs.length;
      if(n){n.textContent=done+"/"+qs.length; n.className="n"+(done===qs.length?" done":"");}
    }else{ if(c)c.textContent=""; if(n)n.textContent=""; }
  });
}
function answeredCount(){
  return TABS[tab].flat.filter(function(f){return !isMeta(f)&&filled(f);}).length;
}
function totalCount(){return TABS[tab].flat.filter(function(f){return !isMeta(f);}).length;}

/* ---------- Estado visible ---------- */
function setStat(cls,html){var s=$("#stat"); s.className="stat"+(cls?" "+cls:""); s.innerHTML=html;}
function notionLink(u){return admin&&u?' <a href="'+esc(u)+'" target="_blank" rel="noopener">Abrir en Notion</a>':"";}
function setDraftNote(ok){
  if(busy)return;
  var n=answeredCount(), t=totalCount();
  var base=n+" de "+t+" preguntas con respuesta. ";
  if(rec.url&&rec.dirty)setStat("warn",base+"Hay cambios sin guardar. Toca Actualizar en Notion.");
  else if(rec.url)setStat("ok",base+"Guardada en Notion a las "+fmtTime(rec.savedAt)+"."+notionLink(rec.url));
  else setStat("",base+(ok?"Borrador guardado en este navegador.":"Este navegador no permite guardar borradores: usa Copiar respuestas."));
}
function updateSaveLabel(){
  $("#saveBtn").textContent=rec.url?"Actualizar en Notion":"Guardar en Notion";
}

/* ---------- Validación y armado ---------- */
function validate(){
  var errs=[], T=TABS[tab];
  T.flat.forEach(function(f){var e=$("#e"+f.i); if(e){e.hidden=true; e.textContent="";}});
  function bad(f,msg){errs.push(f); var e=$("#e"+f.i); if(e){e.hidden=false; e.textContent=msg;}}
  T.flat.forEach(function(f){
    if(f.req&&!filled(f))bad(f,"Este dato es obligatorio.");
    if(f.t==="email"&&filled(f)&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(values[f.p]).trim()))bad(f,"Revisa el correo electrónico.");
  });
  if(!errs.length&&answeredCount()===0){
    errs.push({i:T.flat[0].i}); setStat("warn","La ficha no tiene respuestas todavía. Llena al menos una pregunta antes de guardar.");
  }
  return errs;
}
function buildValues(){
  var T=TABS[tab], out={}, m=mesa();
  T.flat.forEach(function(f){
    var v=values[f.p];
    if(f.t==="multi"){out[f.p]=Array.isArray(v)?v:[]; return;}
    out[f.p]=(v==null?"":String(v)).trim().slice(0,MAXLEN);
  });
  out["Mesa"]=m.n;
  return out;
}
function plainText(){
  var T=TABS[tab], m=mesa(), out=[];
  out.push((tab==="mesa"?"FICHA DE LA MESA":"FICHA DE INSUMOS POR ÁREA")+" — "+(values[T.titleProp]||""));
  out.push("Mesa: "+m.n+" · "+m.name+" ("+m.when+")");
  T.secs.forEach(function(s){
    var lines=[];
    s.fields.forEach(function(f){
      if(f.p===T.titleProp)return;
      if(!filled(f))return;
      var v=values[f.p]; v=Array.isArray(v)?v.join(", "):String(v).trim();
      if(f.proc)v=procLabel(v)+(v?"":"");
      lines.push(f.l+":\n"+v);
    });
    if(lines.length){out.push(""); out.push("## "+s.title); out.push(lines.join("\n\n"));}
  });
  return out.join("\n");
}

/* ---------- Guardado en Notion (vía webhook de Make) ---------- */
function showCode(on){$("#codeBox").hidden=!on;}
function hookReady(){return /^https:\/\/hook\.[a-z0-9.-]*make\.com\//i.test(HOOK)||/^https?:\/\/(127\.0\.0\.1|localhost)[:\/]/.test(HOOK);}
function richText(s){var o=[];for(var i=0;i<s.length;i+=2000)o.push({type:"text",text:{content:s.slice(i,i+2000)}});return o;}
function notionType(f){
  if(f.p===TABS[tab].titleProp)return "title";
  return {text:"rich_text",area:"rich_text",select:"select",multi:"multi_select",date:"date",email:"email",tel:"phone_number"}[f.t];
}
function propFor(type,v,upd){
  var s=Array.isArray(v)?"":String(v==null?"":v).trim();
  switch(type){
    case "title": return s?{title:richText(s)}:undefined;
    case "rich_text": return s?{rich_text:richText(s)}:(upd?{rich_text:[]}:undefined);
    case "select": return s?{select:{name:s.replace(/,/g," ")}}:(upd?{select:null}:undefined);
    case "multi_select":
      var a=(Array.isArray(v)?v:[]).map(function(x){return String(x).trim();}).filter(Boolean);
      return a.length?{multi_select:a.map(function(n){return {name:n.replace(/,/g," ")};})}:(upd?{multi_select:[]}:undefined);
    case "date": return s?{date:{start:s}}:(upd?{date:null}:undefined);
    case "email": return s?{email:s}:(upd?{email:null}:undefined);
    case "phone_number": return s?{phone_number:s}:(upd?{phone_number:null}:undefined);
  }
}
/* Cuerpos ya en formato de la API de Notion: Make solo los reenvía. */
function buildBodies(){
  var T=TABS[tab], create={}, update={};
  T.flat.forEach(function(f){
    var t=notionType(f), v=values[f.p];
    if(f.t!=="multi")v=(v==null?"":String(v)).trim().slice(0,MAXLEN);
    var c=propFor(t,v,false), u=propFor(t,v,true);
    if(c!==undefined)create[f.p]=c;
    if(u!==undefined)update[f.p]=u;
  });
  create["Mesa"]={select:{name:mesa().n}}; update["Mesa"]=create["Mesa"];
  create["ID de envio"]={rich_text:richText(sid)};
  return {
    queryBody:JSON.stringify({filter:{property:"ID de envio",rich_text:{equals:sid}},page_size:1}),
    createBody:JSON.stringify({parent:{type:"data_source_id",data_source_id:DS[tab]},properties:create}),
    updateBody:JSON.stringify({properties:update})
  };
}
function explain(status,data){
  var c=data&&data.code, m=data&&data.message;
  if(c==="bad_code")return {m:"El código de acceso no es correcto. Pídelo al equipo de Bool.",code:true};
  if(c==="notion_rejected"||c==="notion_error")return {m:"Notion no aceptó la ficha"+(m?": "+esc(m):"")+". Usa Copiar respuestas y avisa al equipo de Bool."};
  return {m:"No se pudo confirmar el guardado. Tus respuestas siguen en este borrador. Vuelve a tocar Guardar (no se duplica) o usa Copiar respuestas.",amb:true};
}
async function saveNotion(){
  if(busy)return;
  var errs=validate();
  if(errs.length){var el=$("#f"+errs[0].i); if(el)el.focus(); return;}
  if(!hookReady()){setStat("bad","Falta configurar la URL del webhook de Make en esta página. Avisa al equipo de Bool y usa Copiar respuestas mientras tanto."); return;}
  if(!code){showCode(true); setStat("warn","Escribe el código de acceso que te dio el equipo de Bool."); $("#codeIn").focus(); return;}
  busy=true; $("#saveBtn").disabled=true; $("#saveBtn").textContent="Guardando…"; setStat("","Guardando en Notion…");
  var T=TABS[tab], updating=!!rec.url, ctrl=new AbortController(), to=setTimeout(function(){ctrl.abort();},40000);
  try{
    var b=buildBodies(), f=new URLSearchParams();
    f.set("code",code); f.set("tab",tab); f.set("submissionId",sid); f.set("dataSourceId",DS[tab]);
    f.set("queryBody",b.queryBody); f.set("createBody",b.createBody); f.set("updateBody",b.updateBody);
    var r=await fetch(HOOK,{method:"POST",body:f,signal:ctrl.signal});
    clearTimeout(to);
    var txt=await r.text(), data=null; try{data=JSON.parse(txt);}catch(e){}
    if(!r.ok||!data||data.ok!==true){var er=new Error("hook"); er.status=r.status; er.data=data; throw er;}
    rec={url:data.url||T.dest.url,pageId:data.pageId,savedAt:Date.now(),dirty:false};
    persist();
    busy=false; $("#saveBtn").disabled=false; updateSaveLabel();
    setStat("ok",(updating?"Ficha actualizada":"Ficha guardada")+" en Notion a las "+fmtTime(rec.savedAt)+". Para capturar otra ficha, toca Nueva ficha."+notionLink(rec.url));
  }catch(e){
    clearTimeout(to);
    busy=false; $("#saveBtn").disabled=false; updateSaveLabel();
    var x;
    if(e&&e.status)x=explain(e.status,e.data);
    else x={m:"No hubo conexión con el servidor. Tus respuestas siguen en este borrador; vuelve a tocar Guardar cuando haya señal (no se duplica) o usa Copiar respuestas.",amb:true};
    if(x.code){code=""; try{localStorage.removeItem("fichasChatMPA:code");}catch(_){} showCode(true);}
    setStat(x.amb?"warn":"bad",x.m);
  }
}

/* ---------- Copiar y respaldo ---------- */
async function copyText(){
  var txt=plainText(), fb=$("#fallback");
  try{
    await navigator.clipboard.writeText(txt);
    fb.classList.remove("show"); setStat("ok","Respuestas copiadas. Pégalas en un documento como respaldo.");
  }catch(e){
    $("#fbText").value=txt; fb.classList.add("show"); $("#fbText").focus(); $("#fbText").select();
    setStat("warn","Tu navegador no permitió copiar solo. El texto está abajo, listo para seleccionar.");
  }
}
function download(){
  var m=mesa(), name="ficha-"+(tab==="mesa"?"mesa":"insumos")+"-"+m.k+".md";
  try{
    var blob=new Blob([plainText()],{type:"text/markdown;charset=utf-8"}), u=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=u; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(u);},2000);
    setStat("ok","Respaldo descargado como "+esc(name)+".");
  }catch(e){setStat("warn","No se pudo descargar el respaldo. Usa Copiar respuestas.");}
}

/* ---------- Eventos ---------- */
function onInput(ev){
  var el=ev.target, i=el.dataset&&el.dataset.i; if(i==null)return;
  var f=TABS[tab].flat[+i]; if(!f)return;
  if(f.t==="multi"){
    var arr=[]; f.o.forEach(function(o,j){var c=$("#f"+f.i+"_"+j); if(c&&c.checked)arr.push(o);});
    values[f.p]=arr;
  }else{
    values[f.p]=el.value;
    if(f.t==="area")updateCnt(f);
    if(tab==="mesa"&&f.p==="Ficha (Mesa y fecha)")titleAuto=false;
    if(tab==="mesa"&&f.p==="Fecha de la sesión"&&titleAuto){autoTitle(); setControl(TABS.mesa.flat[0]);}
  }
  var e=$("#e"+f.i); if(e)e.hidden=true;
  if(rec.url){rec.dirty=true;}
  updateCounts(); schedulePersist(); if(!busy)setDraftNote(true);
}
function switchTo(newTab,newMesa){
  persist();
  if(newTab)tab=newTab; if(newMesa)mesaKey=newMesa;
  lsSet("fichasChatMPA:v1:last",JSON.stringify({tab:tab,mesa:mesaKey}));
  resetArmed=false; $("#resetBtn").textContent="Nueva ficha";
  loadDraft(); render(); window.scrollTo(0,0);
}
function init(){
  $("#mesaSel").innerHTML=MESAS.map(function(m){return '<option value="'+m.k+'">'+esc(m.n)+" · "+esc(m.when)+"</option>";}).join("");
  var last=null; try{last=JSON.parse(lsGet("fichasChatMPA:v1:last")||"null");}catch(e){}
  mesaKey=(last&&last.mesa)||MESAS[0].k; tab=(last&&last.tab&&TABS[last.tab])?last.tab:"mesa";
  try{
    var qs=new URLSearchParams(location.search), qm=qs.get("mesa"), qt=qs.get("tab");
    if(qm&&MESAS.some(function(x){return x.k===qm;}))mesaKey=qm;
    if(qt&&TABS[qt])tab=qt;
    admin=qs.get("admin")==="1";
  }catch(e){}
  var ok=false; MESAS.forEach(function(m){if(m.k===mesaKey)ok=true;}); if(!ok)mesaKey=MESAS[0].k;
  $("#mesaSel").value=mesaKey;
  $("#mesaSel").addEventListener("change",function(e){switchTo(null,e.target.value);});
  document.querySelectorAll(".tab").forEach(function(b){b.addEventListener("click",function(){switchTo(b.dataset.tab,null);});});
  $("#main").addEventListener("input",onInput); $("#main").addEventListener("change",onInput);
  $("#nav").addEventListener("click",function(e){
    var b=e.target.closest("button[data-sec]"); if(!b)return;
    var s=$("#sec"+b.dataset.sec); if(s)s.scrollIntoView({behavior:"smooth",block:"start"});
  });
  $("#saveBtn").addEventListener("click",saveNotion);
  $("#copyBtn").addEventListener("click",copyText);
  $("#dlBtn").addEventListener("click",download);
  $("#resetBtn").addEventListener("click",function(){
    if(!rec.url&&answeredCount()>0&&!resetArmed){resetArmed=true; this.textContent="¿Borrar esta ficha sin guardar? Toca otra vez"; return;}
    resetArmed=false; this.textContent="Nueva ficha";
    try{localStorage.removeItem(key());}catch(e){}
    loadDraft(); render(); window.scrollTo(0,0);
  });
  $("#codeBtn").addEventListener("click",function(){
    var v=$("#codeIn").value.trim(); if(!v)return;
    code=v; try{localStorage.setItem("fichasChatMPA:code",v);}catch(e){}
    showCode(false); setStat("ok","Código listo. Toca Guardar en Notion.");
  });
  $("#codeIn").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault(); $("#codeBtn").click();}});
  loadDraft(); render();
  connect();
}
async function connect(){
  needsCode=true;
  if(!hookReady()){showBanner("Esta copia de la página todavía no tiene la URL del webhook de Make. Puedes llenar la ficha y usar Copiar respuestas; guardar en Notion funcionará cuando Bool termine la configuración.");}
  try{code=localStorage.getItem("fichasChatMPA:code")||"";}catch(e){}
  if(!code)showCode(true);
}
function showBanner(t){var b=$("#banner"); b.textContent=t; b.hidden=false;}

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init); else init();
})();
</script>
